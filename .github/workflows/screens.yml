name: screens

# 안드로이드 에뮬레이터에서 실제 화면을 캡처해 ci-screens 브랜치에 남깁니다(디자인 점검용).
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/screens.sh", ".github/workflows/screens.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: 디버그 빌드
        run: gradle --no-daemon assembleDebug
      - name: KVM 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 에뮬레이터에서 화면 캡처
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/screens.sh
      - name: 결과 올리기 (ci-screens 브랜치)
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p shots
          echo "${{ job.status }} ${GITHUB_SHA}" > shots/STATUS
          cd shots
          git init -q
          git checkout -q -b ci-screens
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "screens ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screens
