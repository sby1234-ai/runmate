name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # 서명 키는 저장소에 없고, 저장소 설정의 Secrets에만 있습니다. 없으면 서명 없는 빌드만 만듭니다.
      - name: 서명 키 준비
        env:
          KS: ${{ secrets.RUNMATE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RUNMATE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "서명 키 있음"
          else
            echo "서명 키 없음: 디버그 APK만 만듭니다"
          fi

      - name: 테스트와 빌드
        env:
          RUNMATE_KEYSTORE_PASSWORD: ${{ secrets.RUNMATE_KEYSTORE_PASSWORD }}
          RUNMATE_KEY_ALIAS: ${{ secrets.RUNMATE_KEY_ALIAS }}
          RUNMATE_KEY_PASSWORD: ${{ secrets.RUNMATE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleRelease 2>&1 | tee build.log

      - name: 앱 권한 목록 확인
        if: success()
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          "$AAPT" dump permissions app/build/outputs/apk/release/app-release.apk 2>/dev/null | tee permissions.txt \
            || "$AAPT" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee permissions.txt
          # 허용한 권한 말고 다른 것이 섞여 들어오면(라이브러리가 몰래 넣는 경우 등) 빌드를 실패시킵니다
          ALLOW='^(android.permission.(ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|ACTIVITY_RECOGNITION|POST_NOTIFICATIONS|FOREGROUND_SERVICE|FOREGROUND_SERVICE_LOCATION|INTERNET|ACCESS_NETWORK_STATE|WAKE_LOCK|REQUEST_IGNORE_BATTERY_OPTIMIZATIONS|POST_PROMOTED_NOTIFICATIONS|USE_FULL_SCREEN_INTENT|REQUEST_INSTALL_PACKAGES)|com.google.android.gms.permission.ACTIVITY_RECOGNITION|io.github.sby1234ai.runmate.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION)$'
          EXTRA=$(grep -oP "uses-permission: name='\K[^']+" permissions.txt | grep -vE "$ALLOW" || true)
          if [ -n "$EXTRA" ]; then echo "허용하지 않은 권한: $EXTRA"; exit 1; fi
          echo "권한 확인 통과"

      # 빌드 결과와 로그를 ci-logs 브랜치에 남겨, 로그인 없이도 git으로 확인할 수 있게 합니다.
      - name: 결과 기록 (ci-logs 브랜치)
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/ci
          cp build.log permissions.txt /tmp/ci/ 2>/dev/null || true
          cp -r app/build/reports/tests /tmp/ci/tests 2>/dev/null || true
          cp -r app/build/test-results /tmp/ci/test-results 2>/dev/null || true
          (cd app/build/outputs/apk 2>/dev/null && sha256sum */*.apk) > /tmp/ci/sha256.txt 2>/dev/null || true
          echo "${{ job.status }} ${GITHUB_SHA} ${GITHUB_REF_NAME}" > /tmp/ci/STATUS
          cd /tmp/ci
          git init -q
          git checkout -q -b ci-logs
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "ci ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: runmate-apk
          path: app/build/outputs/apk/**/*.apk

      # 태그를 따로 올리지 않아도, main에 올린 버전(versionName)의 릴리스가 아직 없으면 자동으로 만듭니다.
      - name: 릴리스 만들기 (새 버전일 때)
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="v$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          if gh release view "$VER" >/dev/null 2>&1; then echo "$VER 릴리스가 이미 있습니다"; exit 0; fi
          if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "서명 키가 없어 릴리스를 만들지 않습니다"; exit 1
          fi
          # 릴리스 설명 맨 위에 이번 커밋 제목(바뀐 점)을 넣음 → 앱의 업데이트 창에 그대로 보임
          { echo "바뀐 점: $(git log -1 --pretty=%s "$GITHUB_SHA")"; echo; cat docs/RELEASE_NOTES.md; } > notes.md
          cp app/build/outputs/apk/release/app-release.apk "runmate-${VER}.apk"
          sha256sum "runmate-${VER}.apk" > "runmate-${VER}.apk.sha256"
          gh release create "$VER" "runmate-${VER}.apk" "runmate-${VER}.apk.sha256" \
            --target "$GITHUB_SHA" --title "런메이트 ${VER}" --notes-file notes.md
